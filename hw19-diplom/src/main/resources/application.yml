spring:
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  datasource:
    url: jdbc:postgresql://localhost:5432/diploma_db
    username: otus
    password: otus
    driver-class-name: org.postgresql.Driver
  cache:
    cache-names: usersCache
  sql:
    init:
      mode: never
  jpa:
    open-in-view: false
    generate-ddl: false
    hibernate:
      ddl-auto: none
    defer-datasource-initialization: false
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
server:
  port: 8080
management:
  endpoints:
    web:
      base-path: /api/actuator
      exposure:
        include: health, metrics, logfile
  endpoint:
    health:
      show-details: always
logging:
  file:
    name: logs/app.log

resilience4j:
  circuitbreaker:
    instances:
      dbCircuitBreaker:
        slidingWindowSize: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3

  retry:
    instances:
      dbRetry:
        maxAttempts: 3
        waitDuration: 1s
        ignoreExceptions:
          - ru.otus.exception.CommonBusinessException

