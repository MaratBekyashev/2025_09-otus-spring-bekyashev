<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<div th:replace="~{layout/base :: layout(~{::content})}">

    <div th:fragment="content">

        <!-- HEADER -->
        <div class="d-flex justify-content-between mb-3">
            <h2>Projects</h2>
            <button class="btn btn-primary" onclick="openCreate()">+ Create Project</button>
        </div>

        <!-- TABLE -->
        <table class="table table-bordered table-striped">
            <thead class="table-dark">
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Actions</th>
            </tr>
            </thead>
            <tbody id="projectsTable"></tbody>
        </table>

        <!-- DRAWER -->
        <div id="drawer" class="drawer">

            <div class="drawer-header">
                <h5 id="drawerTitle">Project</h5>
                <button class="btn-close" onclick="closeDrawer()"></button>
            </div>

            <div class="drawer-body">

                <div class="mb-2">
                    <label>ID</label>
                    <input id="projectIdDisplay" class="form-control" readonly>
                </div>

                <input type="hidden" id="projectId">

                <div class="mb-2">
                    <label>Name</label>
                    <input id="projectName" class="form-control">
                </div>

            </div>

            <div class="drawer-footer">
                <button class="btn btn-secondary" onclick="closeDrawer()">Cancel</button>
                <button class="btn btn-success" onclick="saveProject()">Save</button>
            </div>

        </div>

    </div>
</div>

<!-- STYLES -->
<style>
    table, th, td {
        border: 1px solid black !important;
    }
    table {
        border-collapse: collapse;
    }

    .drawer {
        position: fixed;
        top: 0;
        right: -420px;
        width: 420px;
        height: 100%;
        background: white;
        box-shadow: -2px 0 10px rgba(0,0,0,0.2);
        transition: right 0.3s;
        display: flex;
        flex-direction: column;
        z-index: 2000;
    }

    .drawer.open {
        right: 0;
    }

    .drawer-header {
        padding: 15px;
        border-bottom: 1px solid #ddd;
        display: flex;
        justify-content: space-between;
    }

    .drawer-body {
        flex: 1;
        overflow-y: auto;
        padding: 15px;
    }

    .drawer-footer {
        padding: 15px;
        border-top: 1px solid #ddd;
        display: flex;
        justify-content: flex-end;
        gap: 10px;
    }
</style>

<!-- SCRIPT -->
<script>

    document.addEventListener("DOMContentLoaded", () => {
        loadProjects();
    });

    function openCreate() {
        clearForm();

        document.getElementById("drawerTitle").innerText = "Create Project";
        document.getElementById("projectIdDisplay").value = "NEW";

        document.getElementById("drawer").classList.add("open");
    }

    function closeDrawer() {
        document.getElementById("drawer").classList.remove("open");
    }

    async function loadProjects() {
        const res = await apiFetch("/api/projects");
        const data = await res.json();

        const table = document.getElementById("projectsTable");
        table.innerHTML = "";

        data.forEach(p => {
            table.innerHTML += `
            <tr>
                <td>${p.id}</td>
                <td>${p.name}</td>
                <td>
                    <button class="btn btn-sm btn-warning"
                        onclick='editProject(${JSON.stringify(p)})'>Edit</button>

                    <button class="btn btn-sm btn-danger"
                        onclick="deleteProject(${p.id})">Delete</button>
                </td>
            </tr>
        `;
        });
    }

    function editProject(p) {
        document.getElementById("projectId").value = p.id;
        document.getElementById("projectIdDisplay").value = p.id;
        document.getElementById("projectName").value = p.name;

        document.getElementById("drawerTitle").innerText = "Edit Project";
        document.getElementById("drawer").classList.add("open");
    }

    async function saveProject() {
        const id = document.getElementById("projectId").value;
        const name = document.getElementById("projectName").value;

        if (!name) {
            alert("Name is required");
            return;
        }

        const url = id ? `/api/projects/${id}` : "/api/projects";
        const method = id ? "PUT" : "POST";

        await apiFetch(url, {
            method: method,
            body: JSON.stringify({ name })
        });

        closeDrawer();
        loadProjects();
    }

    async function deleteProject(id) {
        if (!confirm("Delete project?")) return;

        await apiFetch(`/api/projects/${id}`, {
            method: "DELETE"
        });

        loadProjects();
    }

    function clearForm() {
        document.getElementById("projectId").value = "";
        document.getElementById("projectIdDisplay").value = "";
        document.getElementById("projectName").value = "";
    }

</script>

</body>
</html>
