<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<div th:replace="~{layout/base :: layout(~{::content})}">

    <div th:fragment="content">

        <div class="d-flex justify-content-between mb-3">
            <h2>Projects</h2>
            <button class="btn btn-primary" onclick="openCreateProject()">+ Create Project</button>
        </div>

        <table class="table table-bordered table-hover" border="1">
            <thead class="table-dark">
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th width="300">Actions</th>
            </tr>
            </thead>
            <tbody id="projectsTable"></tbody>
        </table>

    </div>
</div>

<!-- DRAWER -->
<div id="drawer" class="drawer">

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h5 id="drawerTitle">Edit</h5>
        <button class="btn-close" onclick="closeDrawer()"></button>
    </div>

    <!-- PROJECT FORM -->
    <div id="projectForm">

        <input type="hidden" id="projectId">

        <div class="mb-3">
            <label>Name</label>
            <input id="projectName" class="form-control">
        </div>

        <div class="d-flex gap-2">
            <button class="btn btn-success" onclick="saveProject()">Save</button>
            <button class="btn btn-secondary" onclick="closeDrawer()">Cancel</button>
        </div>

        <hr>

        <h5 id="membersTitle">Members</h5>

        <button class="btn btn-sm btn-primary mb-2" onclick="openAddMember()">+ Add Member</button>

        <table class="table table-sm table-bordered">
            <thead>
            <tr>
                <th>User</th>
                <th>Role</th>
                <th width="120">Actions</th>
            </tr>
            </thead>
            <tbody id="membersTable"></tbody>
        </table>

    </div>

    <!-- MEMBER FORM -->
    <div id="memberForm" style="display:none;">

        <h6 id="memberFormTitle">Add Member</h6>

        <div class="mb-2">
            <label>User</label>
            <select id="memberUser" class="form-select"></select>
        </div>

        <div class="mb-2">
            <label>Role</label>
            <select id="memberRole" class="form-select">
                <option value="OWNER">OWNER</option>
                <option value="DEVELOPER">DEVELOPER</option>
                <option value="TESTER">TESTER</option>
                <option value="ANALYST">ANALYST</option>
                <option value="PROJECT_LEADER">PROJECT_LEADER</option>
            </select>
        </div>

        <div class="d-flex gap-2">
            <button class="btn btn-success" onclick="saveMember()">Save</button>
            <button class="btn btn-secondary" onclick="cancelMember()">Cancel</button>
        </div>

    </div>

</div>

<style>
    .drawer {
        position: fixed;
        top: 0;
        right: -450px;
        width: 450px;
        height: 100%;
        background: white;
        box-shadow: -2px 0 10px rgba(0,0,0,0.2);
        padding: 20px;
        transition: right 0.3s;
        overflow-y: auto;
        z-index: 1050;
    }
    .drawer.open {
        right: 0;
    }
</style>

<script>
    let currentProjectId = null;
    let editingMemberUserId = null;

    document.addEventListener("DOMContentLoaded", () => {
        loadProjects();
    });

    /* ================= DRAWER ================= */

    function openDrawer() {
        document.getElementById("drawer").classList.add("open");
    }

    function closeDrawer() {
        document.getElementById("drawer").classList.remove("open");
        document.getElementById("memberForm").style.display = "none";
        document.getElementById("projectForm").style.display = "block";
    }

    /* CLOSE on outside click */
    document.addEventListener("click", function (e) {
        const drawer = document.getElementById("drawer");

        if (!drawer.classList.contains("open")) return;

        if (!drawer.contains(e.target) && !e.target.closest("button")) {
            closeDrawer();
        }
    });

    /* ESC close */
    document.addEventListener("keydown", function (e) {
        if (e.key === "Escape") closeDrawer();
    });

    /* ================= PROJECT ================= */

    async function loadProjects() {
        const res = await apiFetch("/api/projects");
        const data = await res.json();

        const table = document.getElementById("projectsTable");
        table.innerHTML = "";

        data.forEach(p => {
            table.innerHTML += `
            <tr>
                <td>${p.id}</td>
                <td>${p.name}</td>
                <td>
                    <button class="btn btn-sm btn-warning" onclick="editProject(${p.id}, '${p.name}')">Edit</button>
                    <button class="btn btn-sm btn-danger" onclick="deleteProject(${p.id})">Delete</button>
                    <button class="btn btn-sm btn-info" onclick="viewMembers(${p.id}, '${p.name}')">Members</button>
                </td>
            </tr>
        `;
        });
    }

    function openCreateProject() {
        currentProjectId = null;
        document.getElementById("projectId").value = "";
        document.getElementById("projectName").value = "";
        document.getElementById("drawerTitle").innerText = "Create Project";
        document.getElementById("membersTitle").innerText = "Members";
        openDrawer();
    }

    function editProject(id, name) {
        currentProjectId = id;
        document.getElementById("projectId").value = id;
        document.getElementById("projectName").value = name;
        document.getElementById("drawerTitle").innerText = "Edit Project";
        document.getElementById("membersTitle").innerText = "Members of " + name;
        openDrawer();
        loadMembers();
    }

    async function saveProject() {
        const id = document.getElementById("projectId").value;
        const name = document.getElementById("projectName").value;

        const url = id ? `/api/projects/${id}` : `/api/projects`;
        const method = id ? "PUT" : "POST";

        const res = await apiFetch(url, {
            method,
            body: JSON.stringify({ name })
        });

        if (!res.ok) return showError(res);

        closeDrawer();
        loadProjects();
    }

    async function deleteProject(id) {
        if (!confirm("Delete project?")) return;

        await apiFetch(`/api/projects/${id}`, { method: "DELETE" });
        loadProjects();
    }

    /* ================= MEMBERS ================= */

    function viewMembers(id, name) {
        currentProjectId = id;
        document.getElementById("drawerTitle").innerText = "Project: " + name;
        document.getElementById("membersTitle").innerText = "Members of " + name;
        openDrawer();
        loadMembers();
    }

    async function loadMembers() {
        const res = await apiFetch(`/api/projects/${currentProjectId}/members`);
        const data = await res.json();

        const table = document.getElementById("membersTable");
        table.innerHTML = "";

        data.forEach(m => {
            table.innerHTML += `
            <tr>
                <td>${m.user.userName}</td>
                <td>${m.roleInProject}</td>
                <td>
                    <button class="btn btn-sm btn-warning" onclick="editMember(${m.user.userId}, '${m.roleInProject}')">Edit</button>
                    <button class="btn btn-sm btn-danger" onclick="deleteMember(${m.user.userId})">Delete</button>
                </td>
            </tr>
        `;
        });
    }

    async function openAddMember() {
        editingMemberUserId = null;

        document.getElementById("projectForm").style.display = "none";
        document.getElementById("memberForm").style.display = "block";

        document.getElementById("memberFormTitle").innerText = "Add Member";

        await loadUsers();
    }

    async function editMember(userId, role) {
        editingMemberUserId = userId;

        document.getElementById("projectForm").style.display = "none";
        document.getElementById("memberForm").style.display = "block";

        document.getElementById("memberFormTitle").innerText = "Edit Member";

        await loadUsers();

        document.getElementById("memberUser").value = userId;
        document.getElementById("memberRole").value = role;
    }

    function cancelMember() {
        document.getElementById("memberForm").style.display = "none";
        document.getElementById("projectForm").style.display = "block";
    }

    async function saveMember() {
        const userId = document.getElementById("memberUser").value;
        const role = document.getElementById("memberRole").value;

        const body = {
            user: { userId },
            roleInProject: role
        };

        let res;

        if (editingMemberUserId) {
            res = await apiFetch(`/api/projects/${currentProjectId}/members`, {
                method: "PUT",
                body: JSON.stringify(body)
            });
        } else {
            res = await apiFetch(`/api/projects/${currentProjectId}/members`, {
                method: "POST",
                body: JSON.stringify(body)
            });
        }

        if (!res.ok) return showError(res);

        cancelMember();
        loadMembers();
    }

    async function deleteMember(userId) {
        if (!confirm("Remove member?")) return;

        await apiFetch(`/api/projects/${currentProjectId}/members/${userId}`, {
            method: "DELETE"
        });

        loadMembers();
    }

    /* ================= USERS ================= */

    async function loadUsers() {
        const res = await apiFetch("/api/users");
        const data = await res.json();

        const select = document.getElementById("memberUser");
        select.innerHTML = "";

        data.forEach(u => {
            select.innerHTML += `<option value="${u.userId}">${u.userName}</option>`;
        });
    }


</script>

</body>
</html>
