<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<body th:replace="~{layout/base :: layout(~{::content})}">

<div th:fragment="content">

    <div class="d-flex justify-content-between mb-3">
        <h2>Users</h2>
        <button class="btn btn-primary" onclick="openCreateDrawer()">+ Create User</button>
    </div>

    <!-- FILTER -->
    <div class="row mb-3">
        <div class="col">
            <input id="loginFilter" class="form-control" placeholder="Login">
        </div>
        <div class="col">
            <input id="nameFilter" class="form-control" placeholder="Name">
        </div>
        <div class="col">
            <input id="emailFilter" class="form-control" placeholder="Email">
        </div>
        <div class="col">
            <button class="btn btn-secondary" onclick="loadUsers()">Search</button>
        </div>
    </div>

    <!-- TABLE -->
    <table class="table table-bordered table-hover" border="1">
        <thead class="table-dark">
        <tr>
            <th>ID</th>
            <th>Login</th>
            <th>Name</th>
            <th>Email</th>
            <th>Roles</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody id="usersTable"></tbody>
    </table>

    <!-- DRAWER -->
    <div id="userDrawer" style="
        position: fixed;
        top: 0;
        right: -400px;
        width: 400px;
        height: 100%;
        background: white;
        border-left: 1px solid #ccc;
        padding: 20px;
        transition: 0.3s;
        z-index: 2000;
        overflow-y: auto;
    ">

        <div class="d-flex justify-content-between align-items-center mb-3">
            <h5 id="drawerTitle">User</h5>
            <button class="btn-close" onclick="closeDrawer()"></button>
        </div>

        <input type="hidden" id="userId">

        <div class="mb-2">
            <label>ID</label>
            <input id="userIdDisplay" class="form-control" readonly>
        </div>

        <div class="mb-2">
            <label>Login</label>
            <input id="login" class="form-control">
        </div>

        <div class="mb-2">
            <label>Password</label>
            <input id="password" class="form-control" type="password">
        </div>

        <div class="mb-2">
            <label>Name</label>
            <input id="userName" class="form-control">
        </div>

        <div class="mb-2">
            <label>Email</label>
            <input id="email" class="form-control">
        </div>

        <div class="mb-2">
            <label>Roles (comma separated)</label>
            <input id="roles" class="form-control">
        </div>

        <div class="mt-3">
            <button class="btn btn-success w-100 mb-2" onclick="saveUser()">Save</button>
            <button class="btn btn-secondary w-100" onclick="closeDrawer()">Cancel</button>
        </div>

    </div>

</div>

<!--script th:src="@{/js/users.js}"></script-->

</body>
</html>
