<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Admin Panel</title>
    <meta charset="UTF-8">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }

        .header {
            background: #34495e;
            color: white;
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .container {
            display: flex;
        }

        .sidebar {
            width: 200px;
            background: #2c3e50;
            color: white;
            min-height: 100vh;
            padding: 15px;
        }

        .sidebar a {
            color: white;
            text-decoration: none;
            display: block;
            margin: 10px 0;
        }

        .sidebar a:hover {
            text-decoration: underline;
        }

        .content {
            flex: 1;
            padding: 20px;
        }

        button {
            cursor: pointer;
        }

        #errorBox {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 9999;
            display: none;
            min-width: 250px;
        }
    </style>
</head>

<body th:fragment="layout(content)">

<!-- ERROR BOX -->
<div id="errorBox" class="alert alert-danger" style="display: none; color: red !important;"></div>

<!-- HEADER -->
<div class="header">
    <div>
        <strong>Task Manager</strong>
    </div>

    <div class="d-flex align-items-center gap-3">
        <!-- USER NAME -->
        <span id="currentUserName"></span>

        <button onclick="logout()">Logout</button>
    </div>
</div>

<div class="container">

    <!-- SIDEBAR -->
    <div class="sidebar">
        <h3>Menu</h3>

        <a href="/ui/projects">Projects</a>
        <a href="/ui/tasks">Tasks</a>
        <a href="/ui/users">Users</a>
    </div>

    <!-- CONTENT -->
    <div class="content">
        <div th:replace="${content}"></div>
    </div>

</div>

<!-- ================= SCRIPT ================= -->
<script>
    const token = localStorage.getItem("token");

    if (!token) {
        window.location.href = "/login";
    }

    /* ================= API ================= */
    async function apiFetch(url, options = {}) {

        const headers = {
            "Content-Type": "application/json",
            ...options.headers
        };

        if (token) {
            headers["Authorization"] = "Bearer " + token;
        }

        const response = await fetch(url, {
            ...options,
            headers
        });

        if (response.status === 401) {
            localStorage.removeItem("token");
            window.location.href = "/login";
            return;
        }

        //  обработка ошибок backend
        if (!response.ok) {
            let errorMessage = "Unknown error";

            try {
                const errorData = await response.json();

                if (errorData.message) {
                    errorMessage = errorData.message;
                } else {
                    errorMessage = JSON.stringify(errorData);
                }

            } catch (e) {
                errorMessage = await response.text();
            }

            showError(errorMessage);

            throw new Error(errorMessage);
        }

        return response;
    }

    /* ================= USER ================= */
    async function loadCurrentUser() {
        try {
            const res = await apiFetch("/api/auth/current");
            const user = await res.json();

            const el = document.getElementById("currentUserName");
            if (el) {
                el.innerText = user.userName || user.login;
            }

        } catch (e) {
            console.error("Failed to load current user:", e.message);
        }
    }

    /* ================= ERROR UI ================= */
    function showError(message) {
        const box = document.getElementById("errorBox");

        if (!box) {
            alert(message);
            return;
        }

        box.innerText = message;
        box.style.display = "block";

        setTimeout(() => {
            box.style.display = "none";
        }, 4000);
    }

    /* ================= AUTH ================= */
    function logout() {
        localStorage.removeItem("token");
        window.location.href = "/login";
    }

    /* ================= INIT ================= */
    document.addEventListener("DOMContentLoaded", () => {
        loadCurrentUser();
    });

</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/users.js"></script>
</body>
</html>
