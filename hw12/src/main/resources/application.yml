spring:
  datasource:
    url: jdbc:h2:mem:maindb
  h2:
    console:
      enabled: true
      path: /h2
  sql:
    init:
      mode: always
      data-locations: classpath:data.sql
#      schema-locations: schema.sql
  jpa:
    open-in-view: false
    generate-ddl: false
    hibernate:
      ddl-auto: none
    show-sql: true
server:
  port: 8080