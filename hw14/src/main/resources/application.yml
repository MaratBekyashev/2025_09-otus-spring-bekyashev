
spring:

  batch:
    job:
      enabled: false

  datasource:
    url: jdbc:h2:mem:maindb
  sql:
    init:
      mode: always
      data-locations: data.sql
      schema-locations: schema.sql

  data:
    mongodb:
      host: localhost
      port: 0
      database: SpringBatchExampleDB

  shell:
    interactive:
      enabled: true
    noninteractive:
      enabled: false
    command:
      version:
        enabled: false

  jpa:
    generate-ddl: false
    hibernate:
      ddl-auto: none
    show-sql: true

de:
  flapdoodle:
    mongodb:
      embedded:
        version: 6.0.5
